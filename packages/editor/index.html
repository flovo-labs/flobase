<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flobase Editor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <!-- Google Fonts Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #10120f;
        --surface: #151814;
        --surface-2: #1c221b;
        --surface-3: #242c22;
        --text: #f4f5ef;
        --text-2: #9ba697;
        --muted: #6f7a6b;
        --line: #262f25;
        --line-highlight: #334131;
        --lime: #b8f34a;
        --lime-hover: #c8fa67;
        --lime-muted: #8fca32;
        --lime-ink: #10120f;
        --success: #86d9a0;
        --font-sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-mono: "DM Mono", Menlo, Consolas, Monaco, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--surface);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--line-highlight);
      }

      /* ReactFlow Controls & Attribution overrides */
      .react-flow__controls {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4) !important;
        border: 1px solid var(--line) !important;
        border-radius: 8px !important;
        overflow: hidden !important;
        background: var(--surface) !important;
      }
      .react-flow__controls-button {
        background: var(--surface) !important;
        border-bottom: 1px solid var(--line) !important;
        color: var(--text-2) !important;
        fill: var(--text-2) !important;
      }
      .react-flow__controls-button:hover {
        background: var(--surface-2) !important;
        color: var(--lime) !important;
        fill: var(--lime) !important;
      }
      .react-flow__attribution {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
